version: "3.9"

services:
  # ── DB initialiser (runs once, then exits) ────────────────────────────────
  db-init:
    build: .
    entrypoint: ["python", "mock_data/init_db.py"]
    volumes:
      - mock-db:/app/mock_data/db
      - .:/app
    environment:
      MOCK_DB_PATH: /app/mock_data/db/supply_chain.duckdb
    env_file: .env

  # ── Main multi-agent app ──────────────────────────────────────────────────
  app:
    build: .
    volumes:
      - mock-db:/app/mock_data/db
      - .:/app
    environment:
      PYTHONPATH: /app
      USE_MOCK_DB: "true"
      MOCK_DB_PATH: /app/mock_data/db/supply_chain.duckdb
    env_file: .env
    depends_on:
      db-init:
        condition: service_completed_successfully

  # ── Optional: Jupyter for exploration ────────────────────────────────────
  notebook:
    build: .
    entrypoint: ["python", "-m", "jupyter", "lab", "--ip=0.0.0.0", "--no-browser", "--allow-root"]
    ports:
      - "8888:8888"
    volumes:
      - mock-db:/app/mock_data/db
      - .:/app
    environment:
      PYTHONPATH: /app
      USE_MOCK_DB: "true"
      MOCK_DB_PATH: /app/mock_data/db/supply_chain.duckdb
    env_file: .env
    profiles: ["dev"]

volumes:
  mock-db:
